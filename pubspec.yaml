name: data_naija_app
description: DataNaija — Nigerian VTU mobile app frontend (design reference implementation)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Brand artwork. `app_mark.png` is the DataNaija app mark (used for the
  # launcher icon and small UI placements), `app_logo.png` is the full
  # lockup (mark + "Data Naija" wordmark) used on the splash/onboarding.
  assets:
    - assets/images/
